.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }

pre.card-out { white-space: pre-wrap; font: 14px/1.7 var(--body); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 0; max-height: 420px; overflow: auto }

let S, sample = null, downloads = null, busy = false, justStamped = false, justEdited = null;

const ownLikes = () => S.likes.filter(l => !DECK.some(c => c.v === l));

function done(i) {

    ${S.clips.length ? `<div class="wall">${S.clips.map((c, i) => { const q = c.beats.find(b => b.mine) || c.beats.find(b => b.k === "line"); return `<div class="tile"><span class="stamp">C${String(i + 1).padStart(2, "0")}</span><h3>${esc(c.title)}</h3>${q ? `<span class="quote">「${esc(q.t)}」</span>` : ""}<span class="meta">${c.stage ? esc(c.stage) + " · " : ""}${axesText(c.axes) ? esc(axesText(c.axes)) + " · " : ""}${esc(c.type)} · ${esc(c.place)}${c.flavors?.length ? " · " + esc(c.flavors.join("、")) : ""}</span><div class="row"><button class="btn" type="button" data-reopen="${i}">修改</button><button class="btn" type="button" data-fork="${i}">以它为底再做一条</button><button class="btn ghost" type="button" data-copy="${i}">复制剧本</button><button class="btn ghost" type="button" data-del="${i}">删除</button></div></div>`; }).join("")}</div>` : `<p class="why">还没有作品。去「出名场面」拼第一条吧。</p>`}
    <div class="row"><button class="btn primary" type="button" data-go="3">再来一条</button><button class="btn" type="button" id="exportBtn" ${S.clips.length ? "" : "disabled"}>导出项目卡</button></div>`;
  },
};
function cheer(c) {
  const hits = [c.type, ...S.likes.filter(l => l !== c.type && DECK.find(d => d.v === l && d.g !== "名场面"))].filter(l => S.likes.includes(l)).slice(0, 2);
  const n = S.clips.length;
  const a = hits.length ? `这条用上了你喜欢的「${hits.join("」和「")}」。` : `这条是你拼出来的「${c.type}」。`;
  const b = c.mine ? `里面有 ${c.mine} 处是你亲手写的。` : `下一条试试点一拍自己改，会更像你。`;
  const m = n === 1 ? "第一条名场面完成了！" : n === 3 ? "已经 3 条了，够剪一支预告了。" : `这是你的第 ${n} 条。`;
  return esc(m + a + b);
}
const BIND = {
  taste() {
    const go = like => { const c = DECK[S.deckIdx]; if (!c) return; (like ? S.likes : S.skips).push(c.v); S.deckIdx++; touch(); render(); };
    document.querySelectorAll("[data-unlike]").forEach(b => b.addEventListener("click", () => { S.likes = S.likes.filter(l => l !== b.dataset.unlike); touch(); render(); }));
    $("likeBtn")?.addEventListener("click", () => go(true)); $("skipBtn")?.addEventListener("click", () => go(false));
    $("redoBtn")?.addEventListener("click", () => { S.likes = []; S.skips = []; S.deckIdx = 0; touch(); render(); });
  },
  cast() {
    ["her", "him"].forEach(w => {
      $("name-" + w).addEventListener("input", e => { S.cast[w].name = e.target.value; touch(); });
      $("quirk-" + w).addEventListener("input", e => { S.cast[w].quirk = e.target.value; touch(); });
      document.querySelectorAll(`[data-look-${w}]`).forEach(b => b.addEventListener("click", () => { S.cast[w].look = b.getAttribute(`data-look-${w}`); touch(); render(); }));
      document.querySelectorAll(`[data-vibe-${w}]`).forEach(b => b.addEventListener("click", () => { S.cast[w].vibe = b.getAttribute(`data-vibe-${w}`); touch(); render(); }));
    });
  },
  world() {
    document.querySelectorAll("[data-world]").forEach(b => b.addEventListener("click", () => { S.world = b.dataset.world; touch(); render(); }));
    document.querySelectorAll("[data-rule]").forEach(b => b.addEventListener("click", () => { S.rule = b.dataset.rule; touch(); render(); }));
  },
  scene() {
    document.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => { S.scene.type = b.dataset.type; touch(); render(); }));
    document.querySelectorAll("[data-place]").forEach(b => b.addEventListener("click", () => { S.scene.place = b.dataset.place; touch(); render(); }));
    $("dropBtn")?.addEventListener("click", () => { S.draft = null; S.step = 4; touch(); render(); });
    $("titleEd")?.addEventListener("click", editTitle); $("titleEd")?.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "titleEd") editTitle(); });
    $("stage").addEventListener("change", e => { S.scene.stage = +e.target.value; if (S.draft) S.draft.stage = STAGES[+e.target.value].v; touch(); render(); });
    const sync = () => { if (S.draft) { S.draft.axes = activeAx(); S.draft.stage = stageOn() ? STAGES[stIdx()].v : ""; } touch(); render(); };
    document.querySelectorAll("[data-axis]").forEach(b => b.addEventListener("click", () => { ax()[b.dataset.axis] = b.dataset.v; on()[b.dataset.axis] = true; sync(); }));
    document.querySelectorAll("[data-axon]").forEach(c => c.addEventListener("change", () => { const k = c.dataset.axon; on()[k] = c.checked; if (c.checked && k !== "stage" && !ax()[k]) ax()[k] = AXES.find(x => x.k === k).o[1]; sync(); }));
    $("diceBtn").addEventListener("click", () => { const o = on(); if (!stageOn() && !AXES.some(x => o[x.k])) { o.stage = true; AXES.forEach(x => o[x.k] = true); } AXES.forEach(x => { if (o[x.k]) ax()[x.k] = x.o[Math.floor(Math.random() * 3)]; }); if (stageOn()) S.scene.stage = Math.floor(Math.random() * STAGES.length); sync(); });
    $("wish").addEventListener("input", e => { S.scene.wish = e.target.value; touch(); });
    $("draftBtn")?.addEventListener("click", e => run(e.target, draftScene));
    $("flavorGo")?.addEventListener("click", e => { const f = $("flavorOwn").value.trim(); if (f) run(e.target, () => flavor(f)); else $("flavorOwn").focus(); });
    $("flavorOwn")?.addEventListener("keydown", e => { if (e.key === "Enter") $("flavorGo").click(); });
    document.querySelectorAll("[data-flavor]").forEach(b => b.addEventListener("click", () => run(b, () => flavor(b.dataset.flavor))));
    document.querySelectorAll("[data-edit]").forEach(el => { const open = () => editLine(el); el.addEventListener("click", open); el.addEventListener("keydown", e => { if (e.key === "Enter") open(); }); });
    $("keepBtn")?.addEventListener("click", () => {
      const { editing, from, ...d } = S.draft; const clip = { ...d, mine: d.beats.filter(b => b.mine).length, at: new Date().toISOString().slice(0, 10) };
      if (editing != null && S.clips[editing]) { S.clips[editing] = clip; justEdited = editing; } else { S.clips.push(clip); justStamped = true; }
      S.draft = null; S.scene.wish = ""; S.step = 4; touch(); render(); window.scrollTo({ top: 0 });
    });
  },
  wall() {
    $("exportBtn")?.addEventListener("click", exportCard);
    const open = (i, mode) => { const c = structuredClone(S.clips[i]); delete c.mine; delete c.at; S.draft = { ...c, flavors: c.flavors || [], [mode]: i }; S.scene.type = c.type; S.scene.place = c.place; if (stageOf(c) >= 0) S.scene.stage = stageOf(c); S.scene.axes = { ...(c.axes || {}) }; S.scene.on = { stage: !!c.stage, ...Object.fromEntries(AXES.map(x => [x.k, !!c.axes?.[x.k]])) }; S.step = 3; touch(); render(); window.scrollTo({ top: 0 }); };
    document.querySelectorAll("[data-reopen]").forEach(b => b.addEventListener("click", () => open(+b.dataset.reopen, "editing")));
    document.querySelectorAll("[data-fork]").forEach(b => b.addEventListener("click", () => open(+b.dataset.fork, "from")));
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { if (b.dataset.armed) { S.clips.splice(+b.dataset.del, 1); touch(); render(); } else { b.dataset.armed = "1"; b.textContent = "再点一次删除"; } }));
    document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => { const t = toScript(S.clips[+b.dataset.copy], +b.dataset.copy); try { await navigator.clipboard.writeText(t); setStatus("剧本已复制。"); } catch (e) { setStatus("复制不了，下面是全文。"); $("main").insertAdjacentHTML("beforeend", `<pre class="card-out">${esc(t)}</pre>`); } }));
  },
};
function editTitle() {
  const h = $("titleEd"); if (!h || h.querySelector("input")) return;
  const inp = document.createElement("input"); inp.type = "text"; inp.className = "field"; inp.value = S.draft.title; inp.maxLength = 30; inp.setAttribute("aria-label", "改标题");
  h.replaceChildren(inp); inp.focus(); inp.select(); let fin = false;
  const commit = ok => { if (fin) return; fin = true; const v = inp.value.trim(); if (ok && v) { S.draft.title = v; touch(); } render(); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") commit(true); if (e.key === "Escape") commit(false); });
  inp.addEventListener("blur", () => commit(true));
}
function editLine(el) {
  const i = +el.dataset.edit; const b = S.draft.beats[i]; if (el.querySelector("input")) return;
  const t = el.querySelector(".t"); const inp = document.createElement("input"); inp.type = "text"; inp.value = b.t; inp.id = "edit-" + i; inp.setAttribute("aria-label", "改这句台词");
  t.replaceWith(inp); inp.focus(); inp.select();
  const commit = () => { const v = inp.value.trim(); if (v && v !== b.t) { b.t = v; b.mine = true; touch(); } render(); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); if (e.key === "Escape") { inp.value = b.t; inp.blur(); } });
  inp.addEventListener("blur", commit);
}

function projectCard() {
  return `# 项目卡：${S.world || "未定"}｜${S.rule || ""}\n\n## 口味\n喜欢：${S.likes.join("、")}\n不喜欢：${S.skips.join("、")}\n\n## 角色\n${castText()}\n\n## 世界和规则\n${S.world}；${S.rule}\n\n## 名场面切片（按感情阶段排）\n${S.clips.map((c, i) => [c, i]).sort((a, b) => (stageOf(a[0]) - stageOf(b[0])) || (a[1] - b[1])).map(([c, i]) => `（感情阶段：${c.stage || "未标"}${axesText(c.axes) ? "；" + axesText(c.axes) : ""}）\n` + toScript(c, i) + (c.mine ? `\n（其中 ${c.mine} 句台词是作者亲手写的，后续保留原文）` : "")).join("\n\n")}\n`;
}
async function exportCard() {
  const text = projectCard();
  if (downloads) { try { await downloads.save({ filename: "项目卡.md", data: text }); setStatus("已保存。把这个文件发给 Claude，就能接着做更多切片或整季。"); return; } catch (e) { if (e?.code === "declined") { setStatus("没有保存。"); return; } } }
  try { await navigator.clipboard.writeText(text); setStatus("已复制到剪贴板。"); } catch (e) { setStatus("当前环境不能保存文件，下面是全文，可以手动复制。"); $("main").insertAdjacentHTML("beforeend", `<pre class="card-out">${esc(text)}</pre>`); }
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-own]"); if (!a) return;
  const k = a.dataset.own; const inp = document.createElement("input"); inp.type = "text"; inp.className = "ownin"; inp.maxLength = 40; inp.placeholder = HINT[k] || "写你想要的"; inp.setAttribute("aria-label", "自己写");
  a.replaceWith(inp); inp.focus(); let fin = false;
  const commit = ok => { if (fin) return; fin = true; const v = inp.value.trim(); if (ok && v) { SET[k](v); touch(); } render(); };
  inp.addEventListener("keydown", ev => { if (ev.key === "Enter") commit(true); if (ev.key === "Escape") commit(false); });
  inp.addEventListener("blur", () => commit(true));
});
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) { S.step = +g.dataset.go; save(); render(); window.scrollTo({ top: 0 }); } });
$("newBtn").addEventListener("click", () => { S = BLANK(); save(); render(); });
$("exampleBtn").addEventListener("click", () => { S = structuredClone(EXAMPLE); render(); });
render();
(async () => {
  const c = window.claude;
  const [s, d] = await Promise.all(["sample", "downloads"].map(n => Promise.resolve(c?.use ? c.use(n) : null).catch(() => null)));
  sample = s; downloads = d; $("noAi").hidden = !!sample; render();
})();
</script>
