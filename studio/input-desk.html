<style>
/* 布局：顶部五步进度条，下面一次只做一件事；卡片可点可刷，完成的名场面盖上印章收进作品集 */
:root {
  --bg: #f3f4f1; --paper: #ffffff; --ink: #1d2422; --muted: #5f6b67; --line: #d9ded9;
  --seal: #c22f2a; --seal-soft: #f7e3e1; --jade: #1f6f5f; --jade-soft: #dfeee9; --gold: #a86b00;
  --display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --paper: #1c2321; --ink: #e8ece9; --muted: #9aa6a1; --line: #2f3a37;
  --seal: #ef6a5f; --seal-soft: #3a2220; --jade: #6cc7b1; --jade-soft: #1d3530; --gold: #e3b04a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --paper: #1c2321; --ink: #e8ece9; --muted: #9aa6a1; --line: #2f3a37;
  --seal: #ef6a5f; --seal-soft: #3a2220; --jade: #6cc7b1; --jade-soft: #1d3530; --gold: #e3b04a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.7 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px }
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 18px }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px }
h1 { font: 800 28px/1.2 var(--display); margin: 0; letter-spacing: .02em }
header p { margin: 0; color: var(--muted); flex: 1 1 260px }
.tools { display: flex; gap: 8px; flex-wrap: wrap }
.rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.rail button { flex: 1 0 auto; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--muted); font: 14px var(--body); cursor: pointer; white-space: nowrap }
.rail .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; border: 1.5px solid var(--line) }
.rail .done .n { background: var(--jade); border-color: var(--jade); color: var(--paper) }
.rail [aria-current="step"] { color: var(--ink); border-color: var(--ink) }
.rail [aria-current="step"] .n { border-color: var(--seal); color: var(--seal) }
.step { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px clamp(16px, 4vw, 28px); display: grid; gap: 18px; min-width: 0 }
.step h2 { font: 600 22px/1.3 var(--display); margin: 0; text-wrap: balance }
.why { color: var(--muted); margin: -10px 0 0; max-width: 62ch }
h3 { margin: 0; font: 600 16px var(--display) }
.btn { font: 600 14px/1 var(--body); padding: 11px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.btn.ghost { background: transparent }
.btn:disabled { opacity: .5; cursor: not-allowed }
.btn:focus-visible, .pick:focus-visible, .card:focus-visible, textarea:focus, input:focus { outline: 2px solid var(--jade); outline-offset: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.picks { display: flex; gap: 8px; flex-wrap: wrap }
.pick { font: 14px/1.4 var(--body); padding: 7px 13px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); cursor: pointer }
.pick[aria-pressed="true"] { background: var(--seal-soft); border-color: var(--seal); color: var(--seal); font-weight: 600 }
.group { display: grid; gap: 8px }
.group > span { font-size: 13px; color: var(--muted) }
/* 口味卡 */
.deck { display: grid; place-items: center; gap: 14px; padding: 8px 0 }
.card { width: min(340px, 100%); min-height: 190px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); padding: 20px; display: grid; align-content: space-between; gap: 12px; text-align: left }
.card .kind { font-size: 12px; letter-spacing: .1em; color: var(--jade); font-weight: 700 }
.card .big { font: 800 24px/1.35 var(--display) }
.card .sub { color: var(--muted); font-size: 14px }
.deck .row { justify-content: center }
.deck .btn { min-width: 120px; padding: 13px 18px; font-size: 15px }
.meter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.taste { border-left: 3px solid var(--seal); background: var(--seal-soft); border-radius: 0 10px 10px 0; padding: 12px 16px; display: grid; gap: 6px }
.taste b { font: 800 19px var(--display); color: var(--seal) }
/* 角色卡 */
.chars { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px }
.char { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; background: var(--bg); min-width: 0 }
.char input[type=text] { width: 100%; font: 18px var(--display); background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px }
/* 名场面 */
.script { display: grid; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.beat { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; font-size: 15px }
.beat .no { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 3px }
.beat.line { cursor: text }
.beat.line .t { font-family: var(--display); font-size: 16px }
.beat .who { color: var(--jade); font-weight: 600 }
.beat .tag { font-size: 12px; color: var(--seal); margin-left: 4px }
.beat.mine .t::after { content: " ✎ 你写的"; font: 12px var(--body); color: var(--gold) }
.beat input { width: 100%; font: 16px var(--display); background: var(--paper); color: var(--ink); border: 1px solid var(--jade); border-radius: 6px; padding: 2px 6px }
.slugline { font-size: 13px; color: var(--muted); margin-bottom: 4px }
.flavors { display: flex; gap: 8px; flex-wrap: wrap }
.gates { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px }
.gate { padding: 2px 8px; border-radius: 6px; background: var(--jade-soft); color: var(--jade) }
.gate.bad { background: var(--seal-soft); color: var(--seal) }
.cheer { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--jade-soft) }
.cheer p { margin: 0 }
.stamp { flex: none; width: 58px; height: 58px; border: 3px solid var(--seal); color: var(--seal); border-radius: 8px; display: grid; place-items: center; font: 800 16px/1.1 var(--display); text-align: center; transform: rotate(-8deg) }
@media (prefers-reduced-motion: no-preference) { .stamp.new { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) } @keyframes stamp { from { transform: rotate(-8deg) scale(2.2); opacity: 0 } to { transform: rotate(-8deg) scale(1); opacity: 1 } } }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); display: grid; gap: 8px; position: relative; min-width: 0 }
.tile .stamp { position: absolute; top: 10px; right: 10px; width: 42px; height: 42px; font-size: 12px; border-width: 2px }
.tile h3 { padding-right: 48px }
.tile .quote { font: 600 15px var(--display) }
.tile .meta { font-size: 12px; color: var(--muted) }
.stats { display: flex; gap: 18px; flex-wrap: wrap }
.stats div { display: grid }
.stats b { font: 800 26px var(--display); font-variant-numeric: tabular-nums }
.stats span { font-size: 12px; color: var(--muted) }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em }
.status.err { color: var(--seal) }
.banner { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--seal-soft); color: var(--seal) }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
textarea { width: 100%; font: 15px/1.6 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: vertical }
pre.card-out { white-space: pre-wrap; font: 14px/1.7 var(--body); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 0; max-height: 420px; overflow: auto }
</style>

<div class="wrap">
  <header>
    <h1>灵感输入台</h1>
    <p>点一点就能做出你喜欢的名场面。你负责喜欢什么，AI 负责帮你拼起来。</p>
    <div class="tools"><button class="btn ghost" id="newBtn" type="button">新建</button><button class="btn ghost" id="exampleBtn" type="button">看示例</button></div>
  </header>
  <div class="banner" id="exampleBanner" hidden>正在看示例。点「新建」，从测口味开始做你自己的。</div>
  <div class="banner" id="noAi" hidden>这里连不上 Claude：测口味、捏人、选世界都能用，出名场面要连上 Claude。</div>
  <nav class="rail" id="rail" aria-label="步骤"></nav>
  <main id="main"></main>
</div>

<script>
const STEPS = [
  { k: "taste", t: "测口味" }, { k: "cast", t: "捏人" }, { k: "world", t: "世界和规则" }, { k: "scene", t: "出名场面" }, { k: "wall", t: "作品集" },
];
const DECK = [
  { g: "男主", v: "高冷护短", d: "对谁都冷，只对她例外" },
  { g: "男主", v: "腹黑撩人", d: "嘴上逗她，手上替她挡刀" },
  { g: "男主", v: "病娇占有", d: "温柔得让人害怕" },
  { g: "男主", v: "忠犬奶狗", d: "眼里只有她，一叫就到" },
  { g: "男主", v: "毒舌学霸", d: "一边嫌她笨，一边给她补课" },
  { g: "CP", v: "先婚后爱", d: "签了协议，结果动了真心" },
  { g: "CP", v: "欢喜冤家", d: "见面就吵，吵着吵着就近了" },
  { g: "CP", v: "强弱反转", d: "最强的人，只怕她一个" },
  { g: "CP", v: "破镜重圆", d: "分开五年，又在最狼狈时重逢" },
  { g: "CP", v: "他追她逃", d: "她越躲，他越认真" },
  { g: "名场面", v: "壁咚对视", d: "逼近、停顿、谁先眨眼" },
  { g: "名场面", v: "当众护妻", d: "全场欺负她，他一句话镇住" },
  { g: "名场面", v: "投喂心动", d: "一口吃的，打开一颗心" },
  { g: "名场面", v: "雨夜撑伞", d: "伞往她那边偏了一半" },
  { g: "名场面", v: "打脸反杀", d: "看不起她的人当场傻眼" },
  { g: "名场面", v: "吃醋失控", d: "冷静的他第一次乱了" },
];
const LOOKS = {
  her: [
    { v: "黑长直清冷", p: "young woman, long straight black hair, cool clear eyes, minimal white shirt" },
    { v: "短发元气", p: "young woman, short bob hair with a yellow clip, bright round eyes, oversized hoodie" },
    { v: "温柔大波浪", p: "young woman, soft brown wavy long hair, gentle smile, cream knit cardigan" },
    { v: "古风明艳", p: "young woman, long black hair in an ornate updo with gold hairpins, red hanfu" },
    { v: "眼镜书卷气", p: "young woman, low ponytail, round glasses, plaid skirt and blazer" },
    { v: "飒爽马尾", p: "young woman, high ponytail, sharp brows, black leather jacket" },
  ],
  him: [
    { v: "冷白皮西装", p: "tall young man, pale skin, slicked back black hair, sharp jaw, tailored black suit" },
    { v: "银发异瞳", p: "tall young man, silver-white hair, one gold eye and one blue eye, long dark coat" },
    { v: "阳光运动系", p: "young man, short messy brown hair, warm smile, white sports jacket" },
    { v: "古风长发", p: "tall young man, very long black hair half tied with a jade pin, white robe" },
    { v: "金发吸血鬼", p: "young man, swept golden hair, grey-blue eyes, hint of fangs, burgundy turtleneck" },
    { v: "痞帅机车", p: "young man, undercut black hair, ear piercing, leather jacket" },
  ],
};
const VIBES = { her: ["嘴硬心软", "傻白甜", "清醒独立", "财迷", "社恐", "戏精"], him: ["话少", "腹黑", "毒舌", "护短", "幼稚", "病娇"] };
const WORLDS = ["校园", "豪门", "古风宫廷", "仙侠", "都市职场", "妖精学院"];
const RULES = ["她做的菜能让妖精当一晚凡人", "他只要一心动就会打雷", "她能听见他的心声", "两人离开三米就会互换身体", "她每说一次谎，他就会失忆一天", "他看谁一眼，谁就会爱上他，除了她"];
const PLACES = ["食堂", "教室", "天台", "雨夜街头", "宴会厅", "电梯", "厨房", "钟楼顶"];
const FLAVORS = ["更甜", "更虐", "更好笑", "更霸气", "台词更短", "换个结尾"];

const EXAMPLE = {
  example: true, step: 4, deckIdx: DECK.length,
  likes: ["高冷护短", "病娇占有", "强弱反转", "先婚后爱", "投喂心动", "当众护妻", "雨夜撑伞"],
  skips: ["忠犬奶狗", "破镜重圆", "壁咚对视"],
  cast: { her: { name: "小芜", look: "短发元气", vibe: "嘴硬心软" }, him: { name: "莱昂", look: "金发吸血鬼", vibe: "病娇" } },
  world: "妖精学院", rule: "她做的菜能让妖精当一晚凡人",
  scene: { type: "投喂心动", place: "食堂" },
  draft: null, mine: {},
  clips: [{
    title: "三百年了，番茄是酸的", type: "投喂心动", place: "食堂", flavors: ["更甜"], mine: 1, at: "示例",
    beats: [
      { k: "act", t: "一碗红酸汤被推到金发少年面前，他低头喝了一口", tag: "钩子" },
      { k: "act", t: "他的獠牙一点点缩回去，眼泪砸进碗里" },
      { k: "line", who: "莱昂", how: "哽咽", t: "三百年了，番茄是酸的。", mine: true },
      { k: "act", t: "他抬头看着她，眼眶通红" },
      { k: "line", who: "小芜", how: "别过脸", t: "才不是特意给你做的。" },
      { k: "act", t: "她嘴上这么说，手上又给他添了一勺", tag: "甜点" },
    ],
  }],
};
const BLANK = () => ({ example: false, step: 0, deckIdx: 0, likes: [], skips: [], cast: { her: { name: "", look: "", vibe: "" }, him: { name: "", look: "", vibe: "" } }, world: "", rule: "", scene: { type: "", place: "" }, draft: null, clips: [] });

let S, sample = null, downloads = null, busy = false, justStamped = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KEY = "input-desk-v3";
function load() { try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && typeof v === "object") return Object.assign(BLANK(), v); } catch (e) {} return structuredClone(EXAMPLE); }
function save() { if (S.example) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function touch() { if (S.example) { const keep = S; S = Object.assign(BLANK(), structuredClone(keep), { example: false }); } save(); }
S = load();

function likesOf(g) { return DECK.filter(c => c.g === g && S.likes.includes(c.v)).map(c => c.v); }
function tasteLine() {
  const a = likesOf("男主")[0], b = likesOf("CP")[0], c = likesOf("名场面")[0];
  if (!a && !b && !c) return "";
  return [a, b, c].filter(Boolean).join(" × ");
}
function done(i) {
  const k = STEPS[i].k;
  if (k === "taste") return S.deckIdx >= DECK.length || S.likes.length >= 5;
  if (k === "cast") return !!(S.cast.her.look && S.cast.him.look);
  if (k === "world") return !!(S.world && S.rule);
  if (k === "scene") return S.clips.length > 0;
  if (k === "wall") return S.clips.length >= 3;
}
const nameOf = w => S.cast[w].name.trim() || (w === "her" ? "她" : "他");
function castText() {
  return ["her", "him"].map(w => { const c = S.cast[w]; const look = (LOOKS[w].find(l => l.v === c.look) || {}).p || ""; return `${nameOf(w)}（${w === "her" ? "女主" : "男主"}）：${c.look || "外形未定"}，${c.vibe || "性格未定"}${look ? "｜look: " + look : ""}`; }).join("\n");
}

// ---------- AI ----------
function setStatus(msg, err) { const el = $("status"); if (el) { el.textContent = msg || ""; el.className = "status" + (err ? " err" : ""); } }
async function run(btn, fn) {
  if (busy) return; busy = true; const label = btn.textContent; btn.disabled = true; btn.textContent = "正在写…"; setStatus("");
  try { await fn(); touch(); render(); }
  catch (e) { setStatus(e?.code === "rate_limited" ? "请求太频繁，等一分钟再试。" : e?.code === "not_granted" ? "没有授权页面使用 Claude。" : "这次没成功：" + (e?.message || "请再试一次。"), true); btn.disabled = false; btn.textContent = label; }
  busy = false;
}
const FORMAT = `返回 JSON：{"title":"直白有钩子的标题，12 字内","beats":[{"k":"act","t":"动作","tag":"钩子"},{"k":"line","who":"说话人","how":"语气","t":"台词"}]}
规则：总长约 20 秒，6–8 拍；第 1 拍是画面钩子，tag 写「钩子」；只有一个情绪顶点；最后一拍 tag 写「甜点」「爽点」或「悬念」之一；台词每句不超过 15 字（含标点）；动作只写常见动作，用身体表现情绪；说话人只能是两位主角；不写血腥和擦边。`;
function brief() {
  return `作者喜欢：${S.likes.join("、") || "未测"}；不喜欢：${S.skips.join("、") || "无"}
世界：${S.world}；特殊规则：${S.rule}
角色：\n${castText()}`;
}
async function draftScene() {
  if (!sample) throw { message: "连不上 Claude。" };
  const r = await sample.json(`你是竖屏短剧编剧，帮作者把他喜欢的元素拼成一条名场面切片，要让作者一看就觉得「对，就是这个味儿」。
${brief()}
这条名场面：类型「${S.scene.type}」，地点「${S.scene.place}」。要用上特殊规则，并体现两位主角的性格。
${FORMAT}`, { modelTier: "complex", cache: false });
  S.draft = { title: r.title || `${S.scene.type}`, type: S.scene.type, place: S.scene.place, flavors: [], beats: clean(r.beats) };
}
async function flavor(f) {
  if (!sample) throw { message: "连不上 Claude。" };
  const keep = S.draft.beats.map((b, i) => b.mine ? `第 ${i + 1} 拍是作者自己写的，一字不改：${b.t}` : "").filter(Boolean).join("\n");
  const r = await sample.json(`你是竖屏短剧编剧。作者想把这条名场面调成「${f}」。只改需要改的地方，保留作者喜欢的元素。
${brief()}
现在的版本：${JSON.stringify(S.draft.beats)}
${keep}
${FORMAT}`, { modelTier: "default", cache: false });
  const beats = clean(r.beats);
  const mine = S.draft.beats.map((b, i) => [b, i]).filter(([b]) => b.mine);
  const out = beats.map(b => mine.some(([o]) => o.t === b.t) ? { ...b, mine: true } : b);
  mine.forEach(([o, i]) => { if (!out.some(b => b.mine && b.t === o.t)) { if (out[i]?.k === "line" && !out[i].mine) out[i] = { ...o }; else out.splice(Math.min(i, out.length), 0, { ...o }); } });
  S.draft.beats = out;
  S.draft.flavors = [...S.draft.flavors, f];
}
function clean(beats) { return (Array.isArray(beats) ? beats : []).slice(0, 10).map(b => ({ k: b.k === "line" ? "line" : "act", t: String(b.t || "").trim(), who: b.who ? String(b.who) : undefined, how: b.how ? String(b.how) : undefined, tag: b.tag ? String(b.tag).replace(/^#/, "") : undefined })).filter(b => b.t); }

// ---------- 质量检查（与 check.py 切片模式一致） ----------
function gates(beats) {
  let total = 0, long = 0; beats.forEach(b => { if (b.k === "line") { total += Math.max(1, b.t.replace(/[，。！？…、,.!?\s]/g, "").length / 4.5); if (b.t.length > 15) long++; } else total += 2.5; });
  const last = beats[beats.length - 1] || {};
  return [
    { ok: total >= 12 && total <= 35, t: `约 ${Math.round(total)} 秒` },
    { ok: beats.slice(0, 3).some(b => b.tag === "钩子"), t: "开头有钩子" },
    { ok: ["甜点", "爽点", "悬念"].includes(last.tag), t: "停在情绪顶点" },
    { ok: long === 0, t: long ? `${long} 句台词超过 15 字` : "台词都 ≤15 字" },
  ];
}
function toScript(c, i) {
  const n = String(i + 1).padStart(2, "0"); let total = 0;
  c.beats.forEach(b => total += b.k === "line" ? Math.max(1, b.t.replace(/[，。！？…、,.!?\s]/g, "").length / 4.5) : 2.5);
  const who = [...new Set(c.beats.filter(b => b.who).map(b => b.who))];
  return `# C${n} ${c.title} 目标 ${Math.round(total)} 秒\n## S01 内景 · ${c.place} · 日 ｜ 人物：${(who.length ? who : [nameOf("her"), nameOf("him")]).join(", ")}\n` +
    c.beats.map((b, j) => `${j + 1}. ${b.k === "line" ? `[台词] ${b.who}｜${b.how || "平静"}｜${b.t}` : `[动作] ${b.t}`}${b.tag ? " #" + b.tag : ""}`).join("\n");
}

// ---------- 渲染 ----------
function render() {
  $("exampleBanner").hidden = !S.example;
  $("rail").innerHTML = STEPS.map((s, i) => `<button type="button" data-go="${i}" class="${done(i) ? "done" : ""}" ${i === S.step ? 'aria-current="step"' : ""}><span class="n">${done(i) ? "✓" : i + 1}</span>${s.t}${s.k === "wall" && S.clips.length ? `（${S.clips.length}）` : ""}</button>`).join("");
  const k = STEPS[S.step].k;
  $("main").innerHTML = `<section class="step">${VIEWS[k]()}<div class="status" id="status" role="status"></div><div class="foot">${S.step > 0 ? `<button class="btn ghost" type="button" data-go="${S.step - 1}">上一步</button>` : "<span></span>"}${S.step < STEPS.length - 1 ? `<button class="btn" type="button" data-go="${S.step + 1}">下一步</button>` : ""}</div></section>`;
  BIND[k]?.();
  const cur = document.querySelector('.rail [aria-current="step"]'); const r = $("rail");
  if (cur && r.scrollWidth > r.clientWidth) r.scrollLeft = cur.offsetLeft - (r.clientWidth - cur.offsetWidth) / 2;
  justStamped = false;
}
const pickBtns = (list, sel, attr) => `<div class="picks">${list.map(x => { const v = typeof x === "string" ? x : x.v; return `<button type="button" class="pick" ${attr}="${esc(v)}" aria-pressed="${sel === v}">${esc(v)}</button>`; }).join("")}</div>`;
const VIEWS = {
  taste: () => {
    const c = DECK[S.deckIdx]; const t = tasteLine();
    return `<h2>先测测你喜欢什么</h2><p class="why">不用想，凭第一感觉点。没有对错，你喜欢的就是好的。</p>
    ${c ? `<div class="deck"><div class="card" aria-live="polite"><span class="kind">${c.g}</span><span class="big">${esc(c.v)}</span><span class="sub">${esc(c.d)}</span></div>
      <div class="row"><button class="btn" type="button" id="skipBtn">跳过</button><button class="btn primary" type="button" id="likeBtn">喜欢</button></div>
      <span class="meter">${S.deckIdx + 1} / ${DECK.length}　已喜欢 ${S.likes.length} 个</span></div>` : ""}
    ${t ? `<div class="taste"><span>你的口味</span><b>${esc(t)}</b>${S.likes.length >= 5 ? `<span>${esc(S.likes.join("、"))}</span>` : ""}</div>` : ""}
    ${!c ? `<div class="row"><button class="btn ghost" type="button" id="redoBtn">重新测</button><button class="btn primary" type="button" data-go="1">去捏人</button></div>` : ""}`;
  },
  cast: () => `<h2>捏出你的女主和男主</h2><p class="why">点选外形和性格。名字可以随便起，也可以先空着。</p>
    <div class="chars">${["her", "him"].map(w => `<div class="char"><h3>${w === "her" ? "女主" : "男主"}</h3>
      <input type="text" id="name-${w}" value="${esc(S.cast[w].name)}" placeholder="${w === "her" ? "起个名字，比如小芜" : "起个名字，比如莱昂"}" aria-label="${w === "her" ? "女主名字" : "男主名字"}">
      <div class="group"><span>外形</span>${pickBtns(LOOKS[w], S.cast[w].look, `data-look-${w}`)}</div>
      <div class="group"><span>性格</span>${pickBtns(VIBES[w], S.cast[w].vibe, `data-vibe-${w}`)}</div></div>`).join("")}</div>
    ${likesOf("男主").length ? `<p class="meter">你喜欢的男主类型：${esc(likesOf("男主").join("、"))}</p>` : ""}`,
  world: () => `<h2>选一个世界，加一条特殊规则</h2><p class="why">规则是这部剧最好玩的地方，好多名场面都从它长出来。</p>
    <div class="group"><span>世界</span>${pickBtns(WORLDS, S.world, "data-world")}</div>
    <div class="group"><span>特殊规则</span>${pickBtns(RULES, S.rule, "data-rule")}</div>
    <div class="group"><span>或者写你自己的规则（一句话）</span><textarea id="ruleOwn" rows="2" placeholder="比如：他每说一句真话，头上就会开一朵花">${RULES.includes(S.rule) ? "" : esc(S.rule)}</textarea></div>`,
  scene: () => {
    const liked = likesOf("名场面"); const types = [...new Set([...liked, ...DECK.filter(c => c.g === "名场面").map(c => c.v)])].slice(0, 6);
    const d = S.draft;
    return `<h2>出一条名场面</h2><p class="why">选一种名场面和地点，AI 按你的口味拼一条 20 秒左右的切片。然后用下面的按钮调味，台词点一下就能自己改。</p>
    <div class="group"><span>名场面${liked.length ? "（你喜欢的排在前面）" : ""}</span>${pickBtns(types, S.scene.type, "data-type")}</div>
    <div class="group"><span>地点</span>${pickBtns(PLACES, S.scene.place, "data-place")}</div>
    <div class="row"><button class="btn primary" type="button" id="draftBtn" ${sample && S.scene.type && S.scene.place ? "" : "disabled"}>${d ? "换一版" : "拼一条名场面"}</button>${!sample ? `<span class="meter">要连上 Claude 才能出名场面</span>` : ""}</div>
    ${d ? `<div class="grid" style="display:grid;gap:12px"><h3>${esc(d.title)}</h3>
      <div class="script"><div class="slugline">内景 · ${esc(d.place)} · ${esc(S.world)}　｜　${esc(nameOf("her"))}、${esc(nameOf("him"))}</div>
      ${d.beats.map((b, i) => b.k === "line" ? `<div class="beat line ${b.mine ? "mine" : ""}" data-edit="${i}" role="button" tabindex="0" title="点一下自己改"><span class="no">${i + 1}</span><span><span class="who">${esc(b.who)}</span>（${esc(b.how || "")}）<span class="t">${esc(b.t)}</span>${b.tag ? `<span class="tag">#${esc(b.tag)}</span>` : ""}</span></div>` : `<div class="beat"><span class="no">${i + 1}</span><span>${esc(b.t)}${b.tag ? `<span class="tag">#${esc(b.tag)}</span>` : ""}</span></div>`).join("")}</div>
      <div class="gates">${gates(d.beats).map(g => `<span class="gate ${g.ok ? "" : "bad"}">${g.ok ? "✓" : "✗"} ${esc(g.t)}</span>`).join("")}</div>
      <div class="group"><span>调味${d.flavors.length ? `（已调：${esc(d.flavors.join("、"))}）` : ""}</span><div class="flavors">${FLAVORS.map(f => `<button type="button" class="pick" data-flavor="${f}" ${sample ? "" : "disabled"}>${f}</button>`).join("")}</div></div>
      <div class="row"><button class="btn primary" type="button" id="keepBtn">满意，收进作品集</button></div></div>` : ""}`;
  },
  wall: () => {
    const used = new Set(S.clips.flatMap(c => [c.type])); const mine = S.clips.reduce((n, c) => n + (c.mine || 0), 0);
    const last = S.clips[S.clips.length - 1];
    return `<h2>你的作品集</h2>
    ${last ? `<div class="cheer"><span class="stamp ${justStamped ? "new" : ""}">已<br>收录</span><p>${cheer(last)}</p></div>` : ""}
    <div class="stats"><div><b>${S.clips.length}</b><span>条名场面</span></div><div><b>${used.size}</b><span>种名场面类型</span></div><div><b>${mine}</b><span>句你亲手写的台词</span></div></div>
    ${S.clips.length ? `<div class="wall">${S.clips.map((c, i) => { const q = c.beats.find(b => b.mine) || c.beats.find(b => b.k === "line"); return `<div class="tile"><span class="stamp">C${String(i + 1).padStart(2, "0")}</span><h3>${esc(c.title)}</h3>${q ? `<span class="quote">「${esc(q.t)}」</span>` : ""}<span class="meta">${esc(c.type)} · ${esc(c.place)}${c.flavors?.length ? " · " + esc(c.flavors.join("、")) : ""}</span><div class="row"><button class="btn ghost" type="button" data-copy="${i}">复制剧本</button><button class="btn ghost" type="button" data-del="${i}">删除</button></div></div>`; }).join("")}</div>` : `<p class="why">还没有作品。去「出名场面」拼第一条吧。</p>`}
    <div class="row"><button class="btn primary" type="button" data-go="3">再来一条</button><button class="btn" type="button" id="exportBtn" ${S.clips.length ? "" : "disabled"}>导出项目卡</button></div>`;
  },
};
function cheer(c) {
  const hits = [c.type, ...S.likes.filter(l => l !== c.type && DECK.find(d => d.v === l && d.g !== "名场面"))].filter(l => S.likes.includes(l)).slice(0, 2);
  const n = S.clips.length;
  const a = hits.length ? `这条用上了你喜欢的「${hits.join("」和「")}」。` : `这条是你拼出来的「${c.type}」。`;
  const b = c.mine ? `里面有 ${c.mine} 句是你亲手写的台词。` : `下一条试试点一句台词自己改，会更像你。`;
  const m = n === 1 ? "第一条名场面完成了！" : n === 3 ? "已经 3 条了，够剪一支预告了。" : `这是你的第 ${n} 条。`;
  return esc(m + a + b);
}
const BIND = {
  taste() {
    const go = like => { const c = DECK[S.deckIdx]; if (!c) return; (like ? S.likes : S.skips).push(c.v); S.deckIdx++; touch(); render(); };
    $("likeBtn")?.addEventListener("click", () => go(true)); $("skipBtn")?.addEventListener("click", () => go(false));
    $("redoBtn")?.addEventListener("click", () => { S.likes = []; S.skips = []; S.deckIdx = 0; touch(); render(); });
  },
  cast() {
    ["her", "him"].forEach(w => {
      $("name-" + w).addEventListener("input", e => { S.cast[w].name = e.target.value; touch(); });
      document.querySelectorAll(`[data-look-${w}]`).forEach(b => b.addEventListener("click", () => { S.cast[w].look = b.getAttribute(`data-look-${w}`); touch(); render(); }));
      document.querySelectorAll(`[data-vibe-${w}]`).forEach(b => b.addEventListener("click", () => { S.cast[w].vibe = b.getAttribute(`data-vibe-${w}`); touch(); render(); }));
    });
  },
  world() {
    document.querySelectorAll("[data-world]").forEach(b => b.addEventListener("click", () => { S.world = b.dataset.world; touch(); render(); }));
    document.querySelectorAll("[data-rule]").forEach(b => b.addEventListener("click", () => { S.rule = b.dataset.rule; touch(); render(); }));
    $("ruleOwn").addEventListener("change", e => { if (e.target.value.trim()) { S.rule = e.target.value.trim(); touch(); render(); } });
  },
  scene() {
    document.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => { S.scene.type = b.dataset.type; touch(); render(); }));
    document.querySelectorAll("[data-place]").forEach(b => b.addEventListener("click", () => { S.scene.place = b.dataset.place; touch(); render(); }));
    $("draftBtn")?.addEventListener("click", e => run(e.target, draftScene));
    document.querySelectorAll("[data-flavor]").forEach(b => b.addEventListener("click", () => run(b, () => flavor(b.dataset.flavor))));
    document.querySelectorAll("[data-edit]").forEach(el => { const open = () => editLine(el); el.addEventListener("click", open); el.addEventListener("keydown", e => { if (e.key === "Enter") open(); }); });
    $("keepBtn")?.addEventListener("click", () => {
      const d = S.draft; S.clips.push({ ...d, mine: d.beats.filter(b => b.mine).length, at: new Date().toISOString().slice(0, 10) });
      S.draft = null; S.step = 4; justStamped = true; touch(); render(); window.scrollTo({ top: 0 });
    });
  },
  wall() {
    $("exportBtn")?.addEventListener("click", exportCard);
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { if (b.dataset.armed) { S.clips.splice(+b.dataset.del, 1); touch(); render(); } else { b.dataset.armed = "1"; b.textContent = "再点一次删除"; } }));
    document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => { const t = toScript(S.clips[+b.dataset.copy], +b.dataset.copy); try { await navigator.clipboard.writeText(t); setStatus("剧本已复制。"); } catch (e) { setStatus("复制不了，下面是全文。"); $("main").insertAdjacentHTML("beforeend", `<pre class="card-out">${esc(t)}</pre>`); } }));
  },
};
function editLine(el) {
  const i = +el.dataset.edit; const b = S.draft.beats[i]; if (el.querySelector("input")) return;
  const t = el.querySelector(".t"); const inp = document.createElement("input"); inp.type = "text"; inp.value = b.t; inp.id = "edit-" + i; inp.setAttribute("aria-label", "改这句台词");
  t.replaceWith(inp); inp.focus(); inp.select();
  const commit = () => { const v = inp.value.trim(); if (v && v !== b.t) { b.t = v; b.mine = true; touch(); } render(); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); if (e.key === "Escape") { inp.value = b.t; inp.blur(); } });
  inp.addEventListener("blur", commit);
}

function projectCard() {
  return `# 项目卡：${S.world || "未定"}｜${S.rule || ""}\n\n## 口味\n喜欢：${S.likes.join("、")}\n不喜欢：${S.skips.join("、")}\n\n## 角色\n${castText()}\n\n## 世界和规则\n${S.world}；${S.rule}\n\n## 名场面切片\n${S.clips.map((c, i) => toScript(c, i) + (c.mine ? `\n（其中 ${c.mine} 句台词是作者亲手写的，后续保留原文）` : "")).join("\n\n")}\n`;
}
async function exportCard() {
  const text = projectCard();
  if (downloads) { try { await downloads.save({ filename: "项目卡.md", data: text }); setStatus("已保存。把这个文件发给 Claude，就能接着做更多切片或整季。"); return; } catch (e) { if (e?.code === "declined") { setStatus("没有保存。"); return; } } }
  try { await navigator.clipboard.writeText(text); setStatus("已复制到剪贴板。"); } catch (e) { setStatus("当前环境不能保存文件，下面是全文，可以手动复制。"); $("main").insertAdjacentHTML("beforeend", `<pre class="card-out">${esc(text)}</pre>`); }
}

document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) { S.step = +g.dataset.go; save(); render(); window.scrollTo({ top: 0 }); } });
$("newBtn").addEventListener("click", () => { S = BLANK(); save(); render(); });
$("exampleBtn").addEventListener("click", () => { S = structuredClone(EXAMPLE); render(); });
render();
(async () => {
  const c = window.claude;
  const [s, d] = await Promise.all(["sample", "downloads"].map(n => Promise.resolve(c?.use ? c.use(n) : null).catch(() => null)));
  sample = s; downloads = d; $("noAi").hidden = !!sample; render();
})();
</script>
