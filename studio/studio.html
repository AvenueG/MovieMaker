<title>短剧创作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: a production board. Step rail on the left (concept → storyboard), the active stage's desk on the right */
:root {
  --bg: #f3f3f0; --panel: #ffffff; --ink: #1c1d21; --muted: #646872; --rule: #dedfdb; --field: #fafaf8;
  --accent: #2d4bd6; --accent-ink: #ffffff; --pass: #2f8a4c; --fail: #c23b32; --warn: #b7791f;
  --hook: #c23b32; --shuang: #d9822b; --sweet: #d6488f; --twist: #6f4bd8; --cliff: #1f6fb2; --other: #7b8494;
  --act: #c9ccd2; --dlg: #8d94a1;
  --display: "Noto Serif SC", "Songti SC", serif;
  --sans: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111215; --panel: #1a1b20; --ink: #e8e9ec; --muted: #9a9ea8; --rule: #2d2f36; --field: #15161a;
  --accent: #8b9cff; --accent-ink: #10121a; --pass: #5cc27c; --fail: #ff7a70; --warn: #e8ae52;
  --hook: #ff7a70; --shuang: #f2a65a; --sweet: #f27ab8; --twist: #a68cff; --cliff: #64a8e8; --other: #8a93a3;
  --act: #3a3d46; --dlg: #676d7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111215; --panel: #1a1b20; --ink: #e8e9ec; --muted: #9a9ea8; --rule: #2d2f36; --field: #15161a;
  --accent: #8b9cff; --accent-ink: #10121a; --pass: #5cc27c; --fail: #ff7a70; --warn: #e8ae52;
  --hook: #ff7a70; --shuang: #f2a65a; --sweet: #f27ab8; --twist: #a68cff; --cliff: #64a8e8; --other: #8a93a3;
  --act: #3a3d46; --dlg: #676d7a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 24px }
h1 { font-family: var(--display); font-weight: 900; font-size: 26px; margin: 0; letter-spacing: .03em }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 13.5px }
.notice { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); font-size: 13.5px }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--rule)); background: color-mix(in srgb, var(--warn) 10%, var(--panel)) }

.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr) } }
nav.rail { display: grid; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
@media (max-width: 860px) { nav.rail { position: static; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px } nav.rail .st-d { display: none } }
.st { font: inherit; text-align: left; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 8px; align-items: center }
.st:hover:not([disabled]) { border-color: var(--muted) }
.st[disabled] { cursor: not-allowed; opacity: .55 }
.st[aria-current="step"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.st-n { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 12.5px; font-weight: 600; background: var(--field); border: 1px solid var(--rule) }
.st.done .st-n { background: var(--pass); border-color: var(--pass); color: var(--panel) }
.st.stale .st-n { background: var(--warn); border-color: var(--warn); color: var(--panel) }
.st-t { font-weight: 700; font-size: 14px; line-height: 1.3 }
.st-d { font-size: 12px; color: var(--muted); line-height: 1.3 }
@media (max-width: 860px) { .st { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; padding: 8px 4px } .st-n { grid-row: auto } .st-t { font-size: 12.5px } }
.rail-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }
@media (max-width: 860px) { .rail-foot { grid-column: 1 / -1 } }

.desk { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0 }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.desk h2 { font-family: var(--display); font-size: 21px; margin: 0; line-height: 1.3 }
.lead { color: var(--muted); margin: -6px 0 0; font-size: 13.5px; max-width: 70ch }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.row.between { justify-content: space-between }
.fields { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 10px }
@media (max-width: 700px) { .fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } .fields .wide { grid-column: 1 / -1 } }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0 }
input[type=text], input[type=number], select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0 }
textarea { font-family: var(--sans); font-size: 14px; line-height: 1.8; resize: vertical; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; tab-size: 2 }
textarea.csv { font-family: var(--mono); font-size: 12.5px; line-height: 1.7 }
textarea.idea { font-family: var(--sans); font-size: 16px; white-space: pre-wrap; min-height: 96px }
textarea.doc { min-height: 420px }
textarea.doc.short { min-height: 260px }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }

.btn { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap }
.btn:hover:not([disabled]) { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700 }
.btn.ok { background: var(--pass); border-color: var(--pass); color: var(--panel); font-weight: 700 }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.btn.small { font-size: 12.5px; padding: 4px 10px }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em }
.status.err { color: var(--fail) }
.status.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1s infinite ease-in-out }
@keyframes pulse { 50% { opacity: .2 } }
.stale-bar { padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 14%, var(--panel)); color: var(--ink); font-size: 13px; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--rule)) }

.concepts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
.cc { border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: grid; gap: 8px; background: var(--field); align-content: start }
.cc.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.cc.sel { background: color-mix(in srgb, var(--accent) 6%, var(--field)) }
.cc details summary { font-size: 12px; color: var(--muted); cursor: pointer }
.cc details[open] summary { margin-bottom: 6px }
.from { font-size: 12px; color: var(--accent) }
.pick-sel { display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; margin-right: auto; cursor: pointer }
h4.sec { margin: 0; font-size: 12.5px; letter-spacing: .06em; color: var(--muted) }
.cnt { font-family: var(--sans); font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 6px }
label.f.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px }
label.f.inline select { width: auto; padding: 5px 8px }
.taste { padding: 10px 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); display: grid; gap: 4px; font-size: 13.5px }
.taste p { margin: 0 } .taste b { color: var(--muted); margin-right: 4px }
.merge { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px }
@media (max-width: 560px) { .merge { grid-template-columns: minmax(0, 1fr) } }
.cc h3 { font-family: var(--display); font-size: 18px; margin: 0; line-height: 1.3 }
.cc .tags { font-size: 12px; color: var(--muted) }
.cc p { margin: 0; font-size: 13.5px }
.cc .k { font-size: 11.5px; color: var(--muted); letter-spacing: .04em }
.score { font-family: var(--mono); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) 20px; gap: 2px 8px; font-size: 12px; align-items: center }
.bars i { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; display: block }
.bars i b { display: block; height: 100%; background: var(--accent) }
.bars span:nth-child(3n) { font-family: var(--mono); text-align: right; color: var(--muted) }
.weak { font-size: 12.5px; color: var(--warn) }

.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start }
@media (max-width: 1000px) { .two { grid-template-columns: minmax(0, 1fr) } }
.panel { border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: grid; gap: 10px; background: var(--field); min-width: 0 }
.panel h4 { margin: 0; font-size: 12.5px; letter-spacing: .06em; color: var(--muted); font-weight: 700 }
.verdict { padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: 13.5px }
.verdict.ok { background: color-mix(in srgb, var(--pass) 14%, transparent); color: var(--pass) }
.verdict.bad { background: color-mix(in srgb, var(--fail) 12%, transparent); color: var(--fail) }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.stats div { display: grid }
.stats .k { font-size: 11.5px; color: var(--muted) }
.stats .v { font-family: var(--mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums }
.stats .v small { font-size: 12px; color: var(--muted); font-weight: 400 }
.timeline { display: grid; gap: 3px }
.tl-tags, .tl-gap { position: relative; height: 14px }
.tl-bar { height: 18px; display: flex; border-radius: 4px; overflow: hidden; background: var(--panel) }
.tl-bar span { height: 100%; border-right: 1px solid var(--field); cursor: pointer; min-width: 1px }
.tl-bar span.act { background: var(--act) } .tl-bar span.dlg { background: var(--dlg) } .tl-bar span.bad { background: var(--fail) }
.tl-tags i { position: absolute; top: 1px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; border: 2px solid var(--field); cursor: pointer }
.tl-gap b { position: absolute; top: 3px; height: 8px; border-radius: 4px; background: repeating-linear-gradient(45deg, var(--fail) 0 4px, transparent 4px 8px) }
.tl-ticks { position: relative; height: 13px; font-family: var(--mono); font-size: 10.5px; color: var(--muted) }
.tl-ticks span { position: absolute; transform: translateX(-50%) }
.tl-ticks span:first-child { transform: none }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 4px }
.legend i { width: 9px; height: 9px; border-radius: 50% }
.gates { list-style: none; margin: 0; padding: 0; display: grid }
.gates li { border-top: 1px solid var(--rule); padding: 6px 0; font-size: 13px }
.gates li:first-child { border-top: 0 }
.g-hd { display: flex; gap: 8px; align-items: baseline }
.g-ic { font-family: var(--mono); font-weight: 600; width: 14px; flex: none }
.g-ic.ok { color: var(--pass) } .g-ic.bad { color: var(--fail) } .g-ic.skip { color: var(--muted) }
.g-nm { flex: 1; min-width: 0 }
.g-list { list-style: none; margin: 4px 0 0 22px; padding: 0; display: grid; gap: 2px }
.g-list button { font: inherit; font-size: 12.5px; text-align: left; color: var(--ink); background: transparent; border: 0; padding: 1px 6px; margin-left: -6px; border-radius: 4px; cursor: pointer }
.g-list button:hover { background: var(--panel) }
.g-list button::before { content: "→ "; color: var(--fail) }
.revise { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px }
@media (max-width: 560px) { .revise { grid-template-columns: minmax(0, 1fr) } }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 }
.hint code { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px }
/* tags step */
.tag-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px }
fieldset.tg { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px 12px; margin: 0; background: var(--field); min-width: 0 }
fieldset.tg legend { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 0 4px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; cursor: pointer; line-height: 1.4 }
.chip:hover { border-color: var(--muted) }
.chip.want { background: color-mix(in srgb, var(--pass) 16%, var(--panel)); border-color: var(--pass); color: var(--pass); font-weight: 600 }
.chip.avoid { background: color-mix(in srgb, var(--fail) 10%, var(--panel)); border-color: color-mix(in srgb, var(--fail) 60%, var(--rule)); color: var(--fail); text-decoration: line-through }
.why { margin: 0; font-size: 13px; color: var(--muted); max-width: 70ch }
.picked-line { display: grid; gap: 4px; font-size: 13.5px; padding: 10px 12px; border-radius: 8px; background: var(--field); border: 1px solid var(--rule) }
.picked-line b { display: inline-block; min-width: 3em; color: var(--muted); font-weight: 700 }
/* reading view */
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden }
.seg .btn { border: 0; border-radius: 0 }
.seg .btn[aria-pressed="true"] { background: var(--ink); color: var(--panel) }
.reader { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 20px; max-height: 70vh; overflow: auto; font-size: 15px; line-height: 1.85; overflow-wrap: anywhere }
.reader > * { max-width: 68ch }
.reader p { margin: 0 0 6px }
.reader h3 { font-family: var(--display); font-size: 20px; margin: 0 0 10px; line-height: 1.35 }
.reader h4 { font-size: 12.5px; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule) }
.reader h4:first-child { margin-top: 0 }
.kv { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 10px; padding: 5px 0; border-top: 1px dashed var(--rule) }
.kv:first-of-type { border-top: 0 }
.kv > span { font-size: 12.5px; color: var(--muted); font-weight: 700; padding-top: 3px }
.kv p { margin: 0 }
.ch { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; background: var(--field) }
.ch-hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 4px }
.ch-hd b { font-family: var(--display); font-size: 17px }
.ch-hd span { font-size: 12.5px; color: var(--muted); font-family: var(--mono) }
.ch-hd em { font-style: normal; font-size: 12.5px; color: var(--accent) }
.ch p { font-size: 14px; margin: 2px 0 }
.ch p.look { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px }
.beat { display: grid; grid-template-columns: 3.6em auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 4px 0 }
.beat p { margin: 0 }
.tc { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums }
.tchip { display: inline-block; font-size: 11.5px; font-weight: 700; line-height: 1.5; padding: 0 7px; border-radius: 999px; color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); white-space: nowrap; vertical-align: 1px }
.slug { font-weight: 700; font-size: 13.5px; letter-spacing: .03em; margin: 16px 0 8px; padding: 4px 10px; background: var(--field); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0 }
.act, .dl { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 8px; padding: 3px 0 }
.act p { color: var(--muted); font-style: italic }
.act .tchip { font-style: normal }
.n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; padding-top: 4px }
.dl .who { font-weight: 700; font-size: 13.5px }
.dl .who span { font-weight: 400; color: var(--muted); font-size: 12.5px }
.dl p { padding-left: 1em }
.note { color: var(--muted); font-size: 13px }
.empty { color: var(--muted) }
.shots { display: grid; gap: 10px }
.reader .shots { max-width: none }
.shot { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; background: var(--field) }
.shot-hd { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 4px; font-size: 13px }
.shot-hd b { font-size: 14.5px }
.shot-hd span { color: var(--muted) }
.shot .kv p { font-size: 14px }
.meta { font-size: 12px; color: var(--muted); margin: 6px 0 0 !important }
.epbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--field); border: 1px solid var(--rule) }
.epbar select { width: auto; max-width: 100%; min-width: 0; flex: 0 1 auto }
.eprow { font-size: 12.5px; color: var(--muted); flex: 1 1 240px; min-width: 0 }
.epgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px }
.epc { font: inherit; font-family: var(--mono); font-size: 12px; height: 30px; border-radius: 6px; cursor: pointer; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-bottom: 3px solid var(--c, var(--rule)) }
.epc:hover { border-color: var(--muted) }
.epc.mid { background: color-mix(in srgb, var(--pass) 12%, var(--panel)) }
.epc.done { background: var(--pass); color: var(--panel); border-color: var(--pass); border-bottom-color: var(--c, var(--pass)) }
.epc.miss { opacity: .45; border-style: dashed }
.beat.ep { grid-template-columns: 3.6em minmax(0, 1fr) }
.beat.ep b { font-size: 14.5px }
.reader.season .kv { grid-template-columns: 8.5em minmax(0, 1fr) }
.hk { font-size: 13px; color: var(--muted) }
.auto { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)) }
.aplog { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; max-height: 260px; overflow: auto }
.aplog li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 6px }
.aplog li span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px }
.aplog li.ok { color: var(--pass) } .aplog li.warn { color: var(--warn) } .aplog li.err { color: var(--fail) } .aplog li.pause { color: var(--accent); font-weight: 700 }
.review { border-top: 1px solid var(--rule); padding-top: 10px; display: grid; gap: 8px }
.rv-total { font-family: var(--mono); font-size: 24px; font-weight: 700 }
.rv-total small { font-size: 12px; color: var(--muted); font-weight: 400 }
.rv-total.ok { color: var(--pass) } .rv-total.bad { color: var(--fail) }
.fixes { margin: 0; padding-left: 1.2em; font-size: 13px; display: grid; gap: 4px }
#auto:empty { display: none }
.two > div { grid-template-columns: minmax(0, 1fr) }
.hint { overflow-wrap: anywhere }
@media (prefers-reduced-motion: reduce) { .status.busy::before { animation: none } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>短剧创作台</h1>
      <p class="sub">从一句话开始，概念、大纲、剧本、分镜一步一步写。每一步你确认了才进入下一步，只把上一步的结果交给 AI，省时也省额度。</p>
    </div>
  </header>
  <div class="notice warn" id="noSample" hidden>这个页面需要在 Claude 里打开，AI 才能帮你写。现在你仍然可以手动编辑各步内容，质量检查照常工作。</div>

  <div class="layout">

  G.push(gate("节拍不超出片长", B.some(b => b.t > S.secs) ? [{ msg: `有节拍超过 ${fmt(S.secs)}`, beat: B.find(b => b.t > S.secs) }] : []));
  if (isSweet()) G.push(gate("甜宠向：至少 1 个甜点或心动", B.some(b => b.type === "甜点" || b.type === "心动") ? [] : [{ msg: "这一集没有甜点或心动拍" }]));
  G.push(gate("写了拍板三件事", o.hasDecision ? [] : [{ msg: "缺少「## 拍板」：砍掉、合并、最大爆点" }]));
  return G;
}

async function suggestTags() {
  if (!needSample() || busy) return;
  ctl = new AbortController(); setBusy(true); setStatus("AI 正在挑标签……", "busy");
  try {
    const r = await sample.json(P.tags(), { signal: ctl.signal, modelTier: "quick", cache: false });
    const tags = {};
    TAG_GROUPS.forEach(g => { const pick = (r?.want?.[g.k] || []).map(String).filter(t => g.tags.includes(t)); if (pick.length) tags[g.k] = Object.fromEntries(pick.map(t => [t, 1])); });
    (r?.avoid || []).map(String).forEach(t => { const g = TAG_GROUPS.find(x => x.tags.includes(t)); if (g && !(tags[g.k] || {})[t]) { tags[g.k] = tags[g.k] || {}; tags[g.k][t] = -1; } });
    S.tags = tags; S.custom = (r?.extra || []).map(String).join("，"); S.tagWhy = String(r?.why || ""); S.base.tagsFor = hash(S.idea); S.ok.tags = false;
    save(); setBusy(false); render(); setStatus("已按你的点子预选，点标签可以调整。");
  } catch (e) { setBusy(false); setStatus(errText(e), e?.code === "cancelled" ? "" : "err"); }
}

      <div class="tl-gap">${gaps.map(f => `<b style="left:${f.from / T * 100}%;width:${(f.to - f.from) / T * 100}%"></b>`).join("")}</div>${ticks(T)}</div>
    ${legend(`<span><i style="background:var(--act);border-radius:2px"></i>动作</span><span><i style="background:var(--dlg);border-radius:2px"></i>台词</span>`)}` : ""}
    ${gateList(G)}`;
  $("check").querySelectorAll("[data-l]").forEach(i => i.onclick = () => selectLine(+i.dataset.l));
  bindGateClicks(G, f => f.beat?.lineNo);
  $("check").insertAdjacentHTML("beforeend", reviewBox()); bindReview();
  setFix(G.flatMap(g => g.fails.map(f => `${g.name}：${f.msg}`)));
}
function renderShotsCheck() {
  const ep = parseScript(S.script), R = gatesShots(ep, parseCSV($("doc").value)), n = R.gates.reduce((a, g) => a + g.fails.length, 0), T = R.total || 1;
  $("check").innerHTML = `<h4>分镜检查（对照已确认的剧本）</h4>${verdict(n)}
    <div class="stats"><div><span class="k">镜头</span><span class="v">${R.rows.length}</span></div><div><span class="k">总时长</span><span class="v">${fmt(R.total)}<small> / ${fmt(ep.target || S.secs)}</small></span></div><div><span class="k">平均每镜</span><span class="v">${R.rows.length ? (R.total / R.rows.length).toFixed(1) : 0}<small> 秒</small></span></div></div>
    ${R.rows.length ? `<div class="timeline"><div class="tl-bar">${R.rows.map(r => `<span class="${r._bad ? "bad" : "dlg"}" style="width:${r._dur / T * 100}%" title="镜 ${esc(r.shot)} · ${esc(r.dur)} 秒 · ${esc(r.size)} · 第 ${esc(r.beats)} 拍" data-l="${r._line}"></span>`).join("")}</div>${ticks(T)}</div>
    <div class="legend"><span><i style="background:var(--dlg);border-radius:2px"></i>镜头（宽度＝时长）</span><span><i style="background:var(--fail);border-radius:2px"></i>有问题的镜头</span></div>` : ""}
    ${gateList(R.gates)}`;
  $("check").querySelectorAll("[data-l]").forEach(i => i.onclick = () => selectLine(+i.dataset.l));
  bindGateClicks(R.gates, f => f.row?._line);
  setFix(R.gates.flatMap(g => g.fails.map(f => `${g.name}：${f.msg}`)));
}

// ---------- generation ----------
function setBusy(on) {
  busy = on;
  ["gen", "revise", "confirm", "fix", "suggest", "toConcept", "more", "merge", "taste"].forEach(id => { const b = $(id); if (b) b.disabled = on; });
  const st = $("stop"); if (st) st.hidden = !on;
  const ta = $("doc"); if (ta) ta.readOnly = on;
  document.querySelectorAll("#rail button").forEach(b => { if (on) b.disabled = true; });
  if (!on) renderRail();
}
function needSample() { if (sample) return true; setStatus("这个页面要在 Claude 里打开才能用 AI 生成。你可以先手动编辑。", "err"); return false; }

async function genConcepts() {
  if (!needSample() || busy) return;
  ctl = new AbortController(); setBusy(true); setStatus("AI 正在发散 10 个前提再挑 3 个……通常要 30–90 秒", "busy");
  try {
    const arr = await sample.json(P.concept(), { signal: ctl.signal, cache: false, modelTier: "complex" });
    if (!Array.isArray(arr) || !arr.length) throw { code: "invalid_json" };
    S.seen = S.seen.concat(S.concepts.map(brief));
    S.concepts = arr.slice(0, 3).map(normConcept);
    S.base.conceptsFor = hash(upstreamOf("concept")); save(); setBusy(false); render(); setStatus("喜欢的点「保留」，不喜欢的点「弃掉」，没处理的牌下次抽会被替换。"); return true;
  } catch (e) { setBusy(false); setStatus(errText(e), e?.code === "cancelled" ? "" : "err"); return false; }
}
async function mergeConcepts() {
  if (!needSample() || busy) return;
  const cs = S.sel.map(id => S.keep.find(c => c.id === id)).filter(Boolean); if (cs.length < 2) return;
  S.mergeNote = $("mergeNote")?.value || ""; ctl = new AbortController(); setBusy(true); setStatus(`AI 正在合并 ${cs.length} 张牌……通常要 20–60 秒`, "busy");
  try {
    const r = await sample.json(P.merge(cs), { signal: ctl.signal, cache: false, modelTier: "complex" });
    if (!r || Array.isArray(r) || !r.title) throw { code: "invalid_json" };
    const c = normConcept(r); if (!c.from) c.from = cs.map(x => x.title).join(" + ");
    S.keep.push(c); S.sel = []; S.picked = c.id; S.concept = conceptText(c); S.view.concept = "read"; S.ok.concept = false; markBase("concept");
    save(); setBusy(false); render(); setStatus("合并好了，新牌已放进牌库并选用。原来的牌还在。");
  } catch (e) { setBusy(false); setStatus(errText(e), e?.code === "cancelled" ? "" : "err"); }
}
async function inferTaste() {
  if (!needSample() || busy) return;
  ctl = new AbortController(); setBusy(true); setStatus("AI 正在从你保留和弃掉的牌里推断口味……", "busy");
  try {
    const r = await sample.json(P.taste(), { signal: ctl.signal, cache: false, modelTier: "quick" });
    if (!r || !r.summary) throw { code: "invalid_json" };
    S.taste = { summary: String(r.summary), likes: (r.likes || []).map(String), dislikes: (r.dislikes || []).map(String), want: r.want || {}, avoid: (r.avoid || []).map(String), try: String(r.try || "") };
    save(); setBusy(false); render(); setStatus("下次抽卡会按这个口味来，「抽法」可以选要不要跳出口味。");
  } catch (e) { setBusy(false); setStatus(errText(e), e?.code === "cancelled" ? "" : "err"); }
}
function genStep(k) { return runText(k, P[k]()); }
async function moreEpisodes(from, to) {
  if (!needSample() || busy) return;
  const ta = $("doc"), base = ta.value.replace(/\s+$/, "") + "\n";
  ctl = new AbortController(); setBusy(true); setStatus(`AI 正在续写第 ${from}–${to} 集……`, "busy");
  try {
    const { text } = await sample(P.more(from, to), { signal: ctl.signal, cache: false, onText: ({ text }) => { ta.value = base + text; paintReader("season", ta.value); } });
    const rows = stripFence(text).split(/\r?\n/).map(l => l.trim()).filter(l => /^E\d+｜/.test(l));
    S.season = base + rows.join("\n") + "\n"; ta.value = S.season; S.ok.season = false; markBase("season"); save();
    setBusy(false); renderSeasonCheck(); paintReader("season", S.season); setStatus(`续写了 ${rows.length} 集。`); return rows.length > 0;
  } catch (e) { ta.value = base; setBusy(false); renderSeasonCheck(); setStatus(errText(e), e?.code === "cancelled" ? "" : "err"); return false; }
}
async function runText(k, prompt, after) {
  if (!needSample() || busy) return;
  const ta = $("doc"), before = S[k];
  ctl = new AbortController(); setBusy(true); setStatus(`AI 正在写${NAMES[k]}……开始出字前通常要思考 20–60 秒`, "busy");
  const check = { season: renderSeasonCheck, outline: renderOutlineCheck, script: renderScriptCheck, shots: renderShotsCheck }[k];
  let started = false;
  try {
    const { text, truncated } = await sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => {
      if (!started) { started = true; setStatus(`正在写${NAMES[k]}……`, "busy"); }
      if (ta) { ta.value = text; ta.scrollTop = ta.scrollHeight; } paintReader(k, text);
    } });
    S[k] = stripFence(text); S.ok[k] = false; markBase(k); save();
    if (ta) ta.value = S[k]; S.view[k] = "read"; save(); setView(k, "read");
    setBusy(false); check && check(); after && after();
    setStatus(truncated ? "内容太长被截断了，可以把时长调短一些再生成。" : `${NAMES[k]}写好了。看看右边的检查，满意就确认。`, truncated ? "err" : "");
    return true;
  } catch (e) {
    if (ta) ta.value = before; S[k] = before; paintReader(k, before); setBusy(false); check && check();
    setStatus(errText(e) + (e?.code === "cancelled" ? "已恢复到生成前的版本。" : ""), e?.code === "cancelled" ? "" : "err");
    return false;
  }
}

// ---------- autopilot: generate → gate check → auto-fix (≤3) → script review vs pass line → next step / next episode ----------
const AP = { on: false, log: [] };
const totOf = c => SCORE_KEYS.reduce((a, k) => a + (+(c.scores || {})[k] || 0), 0);
function apLog(msg, cls) { AP.log.push({ t: new Date().toTimeString().slice(0, 5), msg, cls: cls || "" }); AP.log = AP.log.slice(-40); renderAuto(); }
function apGoto(k) { S.step = STEPS.findIndex(s => s.k === k); save(); render(); }
const failsOf = k => ({ season: () => gatesSeason(parseSeason(S.season)), outline: () => gatesOutline(parseOutline(S.outline)), script: () => gatesScript(parseScript(S.script)), shots: () => gatesShots(parseScript(S.script), parseCSV(S.shots)).gates })[k]().flatMap(g => g.fails.map(f => `${g.name}：${f.msg}`));
async function apStage(k, fix = true) {
  if (!S[k] || isStale(k)) { apLog(`${S.nEps > 1 && EPK.includes(k) ? `第 ${S.ep} 集 · ` : ""}生成${NAMES[k]}…`); if (!(await genStep(k))) return false; }
  for (let i = 0; fix && i < 3; i++) {
    const errs = failsOf(k); if (!errs.length) break;
    apLog(`${NAMES[k]}有 ${errs.length} 处没过检查，自动修第 ${i + 1} 轮`); if (!(await runText(k, fixPrompt(k, errs)))) return false;
  }
  const left = failsOf(k); if (fix && left.length) apLog(`${NAMES[k]}修了 3 轮还有 ${left.length} 处没过，先继续，回头请看一下`, "warn");
  return true;
}
async function autopilot() {
  if (AP.on || busy || !needSample()) return;
  AP.on = true; apLog("开始"); renderRail();
  try {
    while (AP.on) {
      const k = STEPS[S.step].k;
      if (k === "idea") { if (!S.idea.trim()) { apLog("先在第 1 步写下一句话点子", "err"); break; } S.ok.idea = true; apGoto("tags"); continue; }
      if (k === "tags") { if (!tagStr().want.length && S.base.tagsFor !== hash(S.idea)) { apLog("AI 挑标签…"); await suggestTags(); } S.ok.tags = true; apGoto("concept"); continue; }
      if (k === "concept") {
        if (!S.concept) {
          if (!S.concepts.length && !S.keep.length) { apLog("抽 3 张概念…"); if (!(await genConcepts())) break; }
          if (S.auto.stopAt === "key") { apLog("挑一张概念（点「用这个」），然后点「继续」", "pause"); break; }
          const best = [...S.concepts, ...S.keep].sort((a, b) => totOf(b) - totOf(a))[0];
          S.picked = best.id; S.concept = conceptText(best); markBase("concept"); apLog(`自动选了分数最高的「${best.title}」`);
        }
        S.ok.concept = true; markBase("concept"); apGoto("season"); continue;
      }
      if (k === "season") {
        if (S.nEps <= 1) { S.ok.season = true; markBase("season"); apGoto("outline"); continue; }
        if (!(await apStage("season", S.nEps <= 30))) break;
        for (let g = 0; g < 4; g++) { const n = parseSeason(S.season).eps.length; if (!n || n >= S.nEps) break; apLog(`续写第 ${n + 1} 集起的分集…`); if (!(await moreEpisodes(n + 1, Math.min(S.nEps, n + 30)))) break; }
        if (S.auto.stopAt === "key" && S.auto.seasonSeen !== hash(S.season)) { S.auto.seasonSeen = hash(S.season); save(); apLog("整季大纲写好了，看一遍，满意就点「继续」", "pause"); break; }
        S.ok.season = true; markBase("season"); apGoto("outline"); continue;
      }
      if (EPK.includes(k)) {
        if (!(await apStage(k))) break;
        if (k === "script") {
          for (let r = 0; r < 2; r++) {
            const rv = await reviewScript(); if (!rv) break;
            apLog(`第 ${S.ep} 集审片 ${rv.total} 分`, rv.total >= S.auto.pass ? "ok" : "warn"); if (rv.total >= S.auto.pass) break;
            if (r === 1) { apLog("重写后还没到及格线，先继续，回头请看一下这一集", "warn"); break; }
            apLog("没到及格线，按审片意见重写…"); if (!(await runText("script", revisePrompt("script", rv.fixes.join("；"))))) break;
            if (!(await apStage("script"))) break;
          }
          if (!AP.on) break;
        }
        S.ok[k] = true; markBase(k);
        if (k !== "shots") { apGoto(EPK[EPK.indexOf(k) + 1]); continue; }
        apLog(`第 ${S.ep} 集完成`, "ok");
        if (S.ep >= Math.min(S.nEps, S.auto.upTo)) { save(); render(); apLog(`已经写到第 ${S.ep} 集，自动驾驶结束`, "ok"); break; }
        loadEp(S.ep + 1); apGoto("outline");
        if (S.auto.stopAt === "ep") { apLog(`点「继续」写第 ${S.ep} 集`, "pause"); break; }
        continue;
      }
      break;
    }
  } finally { AP.on = false; save(); renderAuto(); renderRail(); }
}
function renderAuto() {
  const a = $("auto"); if (!a) return;
  if (!S.autoOpen) { a.innerHTML = ""; return; }
  const A = S.auto;
  a.innerHTML = `<section class="card auto">
    <div class="row between"><h2 style="font-size:17px">自动驾驶</h2><button class="btn small" type="button" id="apClose">收起</button></div>
    <p class="lead">从当前这一步自动往下写：生成，程序检查，没过就自动修（最多 3 轮）；剧本再交给审片 AI 按短剧标准打分，低于及格线就按意见重写一次；然后进入下一步、下一集。页面要一直开着，额度会比手动多用不少。</p>
    <div class="row">
      <label class="f inline">停在 <select id="apStopAt"><option value="key">挑概念、整季写好时</option><option value="ep">每写完一集</option><option value="none">不停</option></select></label>
      <label class="f inline">写到第 <input type="number" id="apUpTo" min="1" max="100" value="${A.upTo}" style="width:4.5em"> 集</label>
      <label class="f inline">审片及格线 <input type="number" id="apPass" min="50" max="95" value="${A.pass}" style="width:4.5em"></label>
    </div>
    <div class="row"><button class="btn primary" type="button" id="apGo" ${AP.on ? "disabled" : ""}>${AP.on ? "运行中…" : AP.log.length ? "继续" : "开始"}</button><button class="btn" type="button" id="apHalt" ${AP.on ? "" : "hidden"}>停止</button></div>
    ${AP.log.length ? `<ol class="aplog">${AP.log.slice(-12).map(l => `<li class="${l.cls}"><span>${l.t}</span>${esc(l.msg)}</li>`).join("")}</ol>` : ""}
  </section>`;
  $("apStopAt").value = A.stopAt;
  $("apStopAt").onchange = () => { A.stopAt = $("apStopAt").value; save(); };
  $("apUpTo").onchange = () => { A.upTo = Math.max(1, Math.min(100, Math.round(+$("apUpTo").value || 1))); save(); };
  $("apPass").onchange = () => { A.pass = Math.max(50, Math.min(95, Math.round(+$("apPass").value || 75))); save(); };
  $("apGo").onclick = autopilot;
  $("apHalt").onclick = () => { AP.on = false; ctl?.abort(); apLog("已停止", "warn"); };
  $("apClose").onclick = () => { S.autoOpen = false; save(); renderRail(); renderAuto(); };
}

// ---------- project file: same shape the Claude Code kit reads and writes (drama-studio/.claude/skills/short-drama-preprod/scripts/studio_sync.py) ----------
const projTitle = () => (S.concept.match(/^#\s*(.+)/m) || [, "短剧项目"])[1].trim();
function projectFile() {
  S.eps[S.ep] = snapEp(); const eps = {};
  for (let n = 1; n <= Math.max(1, S.nEps); n++) { const e = S.eps[n]; if (e && (e.outline || e.script || e.shots)) eps[n] = { outline: e.outline || "", script: e.script || "", shots: e.shots || "" }; }
  return { format: "short-drama-studio", version: 1, title: projTitle(), idea: S.idea, genre: S.genre, secs: S.secs, aspect: S.aspect, nEps: S.nEps, tags: tagStr(), concept: S.concept, season: S.season, eps };
}
function importProject(text) {
  let j; try { j = JSON.parse(text); } catch (e) { throw "这不是项目文件（JSON 读不出来）。"; }
  if (!j || j.format !== "short-drama-studio" || typeof j.eps !== "object") throw "这不是短剧创作台的项目文件。";
  const str = v => typeof v === "string" ? v : "";
  S = blank(); AP.log = [];
  Object.assign(S, { idea: str(j.idea), genre: str(j.genre) || S.genre, secs: Math.max(15, Math.min(900, +j.secs || 60)), aspect: j.aspect === "16:9" ? "16:9" : "9:16", nEps: Math.max(1, Math.min(100, +j.nEps || 1)), concept: str(j.concept), season: str(j.season) });
  S.ok = { idea: !!S.idea.trim(), tags: true, concept: !!S.concept.trim(), season: !!S.season.trim() || S.nEps === 1 };
  if (S.concept) markBase("concept"); if (S.season) markBase("season");
  const list = Object.keys(j.eps).map(Number).filter(n => n >= 1 && n <= S.nEps).sort((a, b) => a - b);
  list.forEach(n => { loadEp(n); const e = j.eps[n] || {}; EPK.forEach(k => { S[k] = str(e[k]); S.ok[k] = !!S[k].trim(); if (S[k]) markBase(k); }); });
  loadEp(list[0] || 1);
  const first = STEPS.findIndex(s => !S.ok[s.k]);
  S.step = first < 0 ? STEPS.length - 1 : first; if (STEPS[S.step].k === "shots" && !S.shots && S.script) S.step = STEPS.findIndex(s => s.k === "script");
  save(); render();
}

// ---------- export ----------
async function saveFile(name, data) {
  if (!data) { setStatus("这一步还没有内容。", "err"); return; }
  if (!downloads) { setStatus("当前环境不能下载文件，可以全选文本框内容复制。", "err"); return; }
  try { await downloads.save({ filename: name, data }); } catch (e) { setStatus("没有保存。"); }
}
function exportAll() {
  const epParts = e => [["大纲", e.outline], ["剧本", e.script], ["分镜（CSV）", e.shots ? "```csv\n" + e.shots.trim() + "\n```" : ""]];
  let parts = [["一句话", S.idea], ["概念", S.concept], ["整季大纲", S.season]];
  if (S.nEps > 1) { for (let n = 1; n <= S.nEps; n++) { const e = epData(n); if (e && (e.outline || e.script || e.shots)) parts = parts.concat(epParts(e).map(([h, v]) => [`第 ${n} 集 · ${h}`, v])); } }
  else parts = parts.concat(epParts(snapEp()));
  parts = parts.filter(p => p[1]);
  const title = (S.concept.match(/^#\s*(.+)/m) || [, "短剧项目"])[1].trim();
  saveFile(`${title}-前期.md`, `# ${title}\n\n` + parts.map(([h, v]) => `## ${h}\n\n${v.trim().replace(/^(#{1,4})\s/gm, "##$1 ")}\n`).join("\n"));
}

// ---------- boot ----------
render();

  const c = window.claude;
  const [s, dl] = await Promise.all([c?.use ? c.use("sample") : null, c?.use ? c.use("downloads") : null].map(p => Promise.resolve(p).catch(() => null)));
  sample = s; downloads = dl;
  $("noSample").hidden = !!sample;
  if (!sample) { const f = $("fix"); if (f) f.hidden = true; }
})();
